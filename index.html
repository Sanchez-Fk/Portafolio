  <!-- Tapa la página antes del primer pintado si la intro va a correr, para que
       el hero no asome un instante. Copia las reglas de src/experience/introStore.js.
       Cerrojo: a los 4 s se retira sola aunque el JS no llegue. -->
  <script>
    (function () {
      try {
        var d = document.documentElement, m = localStorage.getItem('jms-motion');
        var reduce = m === 'off' || (m !== 'on' && matchMedia('(prefers-reduced-motion: reduce)').matches);
        if (/[?&]motion=force/.test(location.search)) reduce = false;
        if ((location.hash && location.hash !== '#hero') || reduce ||
            sessionStorage.getItem('jms-intro-seen') || localStorage.getItem('jms-intro') === 'off') return;
        d.classList.add('intro-pending');
        setTimeout(function () { d.classList.remove('intro-pending'); }, 4000);
      } catch (e) { /* almacenamiento bloqueado: sin tapa */ }
    })();
  </script>
  <style>.intro-pending body::after{content:"";position:fixed;inset:0;z-index:9998;background:#12131E}</style>
