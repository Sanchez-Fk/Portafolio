# Stack completo de la automatización: Postgres + Evolution API (WhatsApp) + n8n.
#
#   docker compose up -d
#
# Todo vive en la red interna `prospector`. Lo único que se publica al host es
# n8n (5678) y Evolution (8080). Postgres NO se publica a propósito: si lo
# necesitas desde tu máquina, descomenta el bloque `ports` de `postgres`.

name: lumina-prospector

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: prospector
      TZ: ${TZ}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Se ejecuta UNA sola vez, cuando el volumen está vacío. Si cambias el
      # esquema después, aplica los cambios a mano (ver README → Migraciones).
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d prospector"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [prospector]
    # ports:
    #   - "5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [prospector]

  # Gateway de WhatsApp NO oficial (Baileys). Se vincula escaneando un QR desde
  # WhatsApp → Dispositivos vinculados, igual que WhatsApp Web.
  evolution:
    image: atendai/evolution-api:v2.2.3
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      SERVER_URL: ${EVOLUTION_URL_PUBLICA}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      LANGUAGE: es
      TZ: ${TZ}

      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"

      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"

      # El webhook por instancia se configura desde el script de bootstrap.
      # Aquí solo dejamos apagado el webhook global.
      WEBHOOK_GLOBAL_ENABLED: "false"

      QRCODE_LIMIT: "30"
      DEL_INSTANCE: "false"
      LOG_LEVEL: ERROR
      LOG_COLOR: "true"
    volumes:
      - evolution_instances:/evolution/instances
    ports:
      - "${EVOLUTION_PUERTO:-8080}:8080"
    networks: [prospector]

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}

      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: "5678"
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${N8N_URL_PUBLICA}
      GENERIC_TIMEZONE: ${TZ}
      TZ: ${TZ}

      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_SECURE_COOKIE: "false"
      N8N_RUNNERS_ENABLED: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"

      # Los flujos leen su configuración de la tabla `ajustes`, no del entorno.
      # Esto queda por si escribes un nodo Code que necesite algo del host.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"

      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/flujos:ro
    ports:
      - "${N8N_PUERTO:-5678}:5678"
    networks: [prospector]

volumes:
  postgres_data:
  redis_data:
  evolution_instances:
  n8n_data:

networks:
  prospector:
    driver: bridge
